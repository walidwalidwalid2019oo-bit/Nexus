name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PURPLE-HAZE/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev             libtinfo6 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Build debug APK
        working-directory: PURPLE-HAZE
        run: buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: purple-haze-debug-apk
          path: PURPLE-HAZE/bin/*.apk
          if-no-files-found: error
