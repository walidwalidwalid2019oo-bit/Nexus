name: Build PURPLE HAZE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PURPLE-HAZE/**"
      - ".github/workflows/purple-haze-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake             libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Check Python syntax
        working-directory: PURPLE-HAZE
        run: python -m py_compile main.py
      - name: Build debug APK
        working-directory: PURPLE-HAZE
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: purple-haze-debug-apk
          path: PURPLE-HAZE/bin/*.apk
          if-no-files-found: error
